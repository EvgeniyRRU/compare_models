<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Обращения</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="topbar">
    <nav id="tabs" class="tabs"></nav>
  </header>

  <main>
    <section id="list-screen">
      <div class="filters">
        <select id="filter-status" aria-label="Статус">
          <option value="">Все статусы</option>
          <option value="new">Новое</option>
          <option value="in_progress">В работе</option>
          <option value="waiting_info">Ожидает информации</option>
          <option value="resolved">Решено</option>
          <option value="rejected">Отклонено</option>
          <option value="duplicate">Дубль</option>
        </select>
        <select id="filter-priority" aria-label="Приоритет">
          <option value="">Все приоритеты</option>
          <option value="critical">Критический</option>
          <option value="high">Высокий</option>
          <option value="medium">Средний</option>
          <option value="low">Низкий</option>
        </select>
      </div>
      <div id="ticket-list" class="cards"></div>
      <button id="load-more" class="btn secondary hidden">Загрузить ещё</button>
    </section>

    <section id="card-screen" class="hidden">
      <button id="back-to-list" class="btn secondary">← Назад</button>
      <div id="ticket-card"></div>
    </section>

    <section id="roles-screen" class="hidden">
      <input id="roles-search" type="search" placeholder="Поиск по имени или @username" />
      <div id="roles-list" class="cards"></div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
