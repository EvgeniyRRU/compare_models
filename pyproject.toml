[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rent-support-bot"
version = "0.1.0"
description = "Telegram support ticket tracking bot"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.120",
  "uvicorn[standard]>=0.38",
  "python-telegram-bot>=22.5",
  "SQLAlchemy[asyncio]>=2.0.44",
  "asyncpg>=0.31",
  "alembic>=1.17",
  "pydantic-settings>=2.11",
  "structlog>=25.4",
  "sentry-sdk[fastapi]>=2.42",
  "prometheus-client>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.4", "pytest-asyncio>=1.2", "httpx>=0.28", "ruff>=0.14", "mypy>=1.18"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.14"
strict = false
check_untyped_defs = true
