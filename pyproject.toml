[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "support-bot"
version = "0.1.0"
description = "Telegram support ticket tracking bot and Mini App"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.162.0", "python-telegram-bot==22.8",
  "SQLAlchemy[asyncio]==2.1.6", "asyncpg==0.32.0", "alembic==1.20.1",
  "pydantic-settings==2.16.1", "uvicorn==0.54.0", "structlog==26.1.0",
  "sentry-sdk[fastapi,sqlalchemy]==2.73.0", "prometheus-client==0.26.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "httpx==0.28.1", "ruff==0.17.2", "mypy==2.4.0", "watchfiles==1.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
support_bot = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires TEST_DATABASE_URL pointing to an isolated PostgreSQL database"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.14"
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
