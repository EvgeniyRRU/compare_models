[project]
name = "support-bot"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.17,<2",
    "asyncpg>=0.31,<1",
    "fastapi>=0.120,<1",
    "prometheus-client>=0.23,<1",
    "pydantic-settings>=2.11,<3",
    "python-telegram-bot>=22.5,<23",
    "sentry-sdk>=2.40,<3",
    "sqlalchemy[asyncio]>=2.0.44,<3",
    "structlog>=25.4,<27",
    "uvicorn[standard]>=0.38,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.2,<2", "ruff>=0.14,<1", "mypy>=1.18,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true
disable_error_code = ["var-annotated"]
