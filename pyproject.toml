[project]
name = "support-bot"
version = "0.1.0"
description = "Telegram bot and Mini App for support-to-developer ticket tracking"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20,<2",
    "asyncpg>=0.32,<0.33",
    "fastapi>=0.162,<1",
    "prometheus-client>=0.26,<0.27",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "python-telegram-bot>=22.8,<23",
    "sentry-sdk[fastapi,sqlalchemy]>=2.73,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "structlog>=26.1,<27",
    "uvicorn[standard]>=0.54,<0.55",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<0.29",
    "mypy>=2.4,<3",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "ASYNC",
    "S",
    "RUF",
]
ignore = [
    "S101",   # assert in tests
    "RUF001", # cyrillic characters in strings are intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"migrations/*" = ["E501"]
"src/support_bot/api/**" = ["B008"]
"src/support_bot/main.py" = ["S104"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
plugins = ["pydantic.mypy"]
files = ["src/support_bot"]
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error::DeprecationWarning:support_bot.*"]