[project]
name = "rent-support-bot"
version = "0.1.0"
description = "Telegram bot for accounting first-line support requests to the duty developer"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.163",
    "uvicorn[standard]>=0.34",
    "python-telegram-bot>=22.8,<23",
    "sqlalchemy[asyncio]>=2,<3",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic-settings>=2",
    "structlog>=24",
    "sentry-sdk>=2.75",
    "prometheus-client>=0.20",
    "httpx>=0.28",
    "greenlet>=3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-PyYAML",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM", "RUF", "C4", "PTH", "T20"]
# Russian UI strings legitimately contain ambiguous unicode punctuation.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"app/migrations/*" = ["T20"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["prometheus_client.*", "telegram.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
