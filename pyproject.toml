[project]
name = "support-bot"
version = "0.1.0"
description = "Telegram-бот учёта обращений первой линии поддержки к дежурному разработчику"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.17",
    "asyncpg>=0.31",
    "fastapi>=0.120",
    "prometheus-client>=0.23",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "python-telegram-bot>=22.5",
    "sentry-sdk[fastapi,sqlalchemy]>=2.40",
    "sqlalchemy[asyncio]>=2.0.44",
    "structlog>=25.4",
    "uvicorn[standard]>=0.38",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_bot"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/support_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["error"]
