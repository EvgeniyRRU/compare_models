[project]
name = "support-bot"
version = "0.1.0"
description = "Telegram-бот учёта обращений первой линии поддержки к дежурному разработчику"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.17",
    "asyncpg>=0.31",
    "fastapi>=0.120",
    "prometheus-client>=0.23",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "python-telegram-bot>=22.5",
    "sentry-sdk>=2.40",
    "sqlalchemy[asyncio]>=2.0.44",
    "structlog>=25.4",
    "uvicorn[standard]>=0.38",
]

[dependency-groups]
test = [
    "httpx>=0.28",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
]
dev = [
    { include-group = "test" },
    "mypy>=1.18",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF", "N", "C4", "PT"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # кириллица в строках и комментариях
    "ASYNC109",  # таймаут блокировки — осознанный параметр
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT018"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/support_bot"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:telegram.*"]
