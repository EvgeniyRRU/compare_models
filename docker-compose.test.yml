services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: support
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgresql+asyncpg://support:support@db:5432/support
    depends_on:
      db:
        condition: service_healthy
    command: pytest -v

volumes:
  pgdata: