name: rent-support-bot-test
services:
  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
      POSTGRES_DB: support_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql
  tests:
    build:
      context: .
      target: test
    environment:
      BOT_TOKEN: "123456:test_token"
      TEST_DATABASE_URL: postgresql+asyncpg://support:support@postgres-test:5432/support_test
    depends_on:
      postgres-test:
        condition: service_healthy
