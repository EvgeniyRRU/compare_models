services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: support
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build:
      context: .
      target: dev
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/support
      BOT_MODE: polling
    ports: ["8000:8000", "127.0.0.1:9090:9090"]
    depends_on:
      db:
        condition: service_healthy
    volumes: [".:/app"]
  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/support_test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/support_test
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
