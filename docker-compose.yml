services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: rent_bot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d rent_bot"]
      interval: 2s
      timeout: 2s
      retries: 20

  app:
    build:
      context: .
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://bot:bot@postgres:5432/rent_bot
      LOG_FORMAT: pretty
    ports:
      - "8000:8000"
      - "9464:9464"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["dev"]

  test:
    build:
      context: .
      target: test
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://bot:bot@postgres:5432/rent_bot_test
      TEST_DATABASE_URL: postgresql+asyncpg://bot:bot@postgres:5432/rent_bot_test
      LOG_FORMAT: pretty
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["test"]

volumes:
  pgdata:
