services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: support_bot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d support_bot"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
    name: support_bot_pgdata
