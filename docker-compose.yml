services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: support_bot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d support_bot"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://bot:bot@db:5432/support_bot
      BOT_MODE: polling
      LOG_FORMAT: console
    command: >
      sh -c "alembic upgrade head &&
             uvicorn support_bot.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
      - "9100:9100"
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy

  test:
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://bot:bot@db:5432/support_bot_test
      DATABASE_URL: postgresql+asyncpg://bot:bot@db:5432/support_bot
      BOT_TOKEN: test:token
      DEV_CHAT_ID: "-100"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    depends_on:
      db:
        condition: service_healthy
    profiles: ["test"]

volumes:
  pgdata:
    name: support_bot_pgdata
